name: Release

on:
  release:
    types: [created]

jobs:
  sonar_analysis:
    uses: eclipse-ecsp/.github/.github/workflows/workflow-sonar-analysis.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    secrets:
      token: ${{ secrets.SONAR_TOKEN }}
    with:
      java_version: '25'
      java_distribution: 'temurin'
  licence_compliance_status:
    needs: sonar_analysis
    uses: eclipse-ecsp/.github/.github/workflows/workflow-licences-analysis.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    name: Check Licence Compliance Status
    with:
      java_version: '25'
      java_distribution: 'temurin'
      create-review: false

  extract_version:
    runs-on: ubuntu-latest
    needs: licence_compliance_status
    name: Extract release version without v prefix
    outputs:
      release_version: ${{ steps.set_version.outputs.release_version }}
    steps:
      - id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
              if [[ "${{ github.event.release.tag_name }}" == v* ]]; then
                  version=${{ github.event.release.tag_name }}
                  echo "release_version=${version:1}" >> $GITHUB_ENV
                  echo "::set-output name=release_version::${version:1}"
              else
                  echo "release_version=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
                  echo "::set-output name=release_version::${{ github.event.release.tag_name }}"
              fi
          else
            version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
            echo "release_version=$version" >> $GITHUB_ENV
            echo "::set-output name=release_version::$version"
          fi

  publish_artifacts:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-publish-artifacts.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }} 
    with:
      java_version: '25'
      java_distribution: 'temurin'
      release_version: ${{ needs.extract_version.outputs.release_version }}

  docker_push_api_registry:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-docker-push.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_API_TOKEN: ${{ secrets.DOCKER_API_TOKEN }}
    with:
      context_path: ./api-registry
      image_tag: ${{ needs.extract_version.outputs.release_version }}
      maven_args: 'clean package -P release'
      java_version: '25'
      java_distribution: 'temurin'

  docker_push_api_gateway:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-docker-push.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_API_TOKEN: ${{ secrets.DOCKER_API_TOKEN }}
    with:
      context_path: ./api-gateway
      image_tag: ${{ needs.extract_version.outputs.release_version }}
      maven_args: 'clean package -P release'
      java_version: '25'
      java_distribution: 'temurin'

  update_next_version:
    needs: extract_version
    uses: eclipse-ecsp/.github/.github/workflows/workflow-update-next-version.yml@cd37031cbafcac029ce6cd8b98dba5c41e9531d6
    with:
      version: ${{ needs.extract_version.outputs.release_version }}
      java_version: '25'
      java_distribution: 'temurin'
    secrets: 
      ECSP_BOT_PAT: ${{ secrets.ECSP_BOT_PAT }}
